name = "keyzai-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
OPENAI_API_URL = "https://gateway.dahono.com/v1"
OPENAI_MODEL = "dahono/ai-chat"
ALLOWED_ORIGINS = "http://localhost:5173,https://keyz-ai.vercel.app"

[env.production]
name = "keyzai-worker-prod"

[env.production.vars]
OPENAI_API_URL = "https://gateway.dahono.com/v1"
OPENAI_MODEL = "dahono/ai-chat"
ALLOWED_ORIGINS = "http://localhost:5173,https://keyz-ai.vercel.app"
