<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>KeyzAI</title>
    <!-- Synchronous dark-theme CSS vars: nilai CSS var (--background dst) tidak
         bisa di-resolve sebelum CSS bundle (async) termuat. Kalau dibiarkan,
         browser pakai default transparent → body putih sesaat sebelum bundle
         masuk, menyebabkan blank flash di mobile.
         Inline style ini dipasang langsung ke <html> supaya nilai var()
         tersedia seketika, tanpa menunggu apa pun. -->
    <style>html{--background:0 0% 4%;--foreground:0 0% 95%;--card:0 0% 6.5%;--card-foreground:0 0% 95%;--popover:0 0% 6.5%;--popover-foreground:0 0% 95%;--primary:0 0% 95%;--primary-foreground:0 0% 8%;--secondary:0 0% 9%;--secondary-foreground:0 0% 95%;--muted:0 0% 9%;--muted-foreground:0 0% 68%;--accent:0 0% 10.5%;--accent-foreground:0 0% 95%;--destructive:40.6 96.1% 40.4%;--destructive-foreground:0 0% 95%;--border:0 0% 10.5%;--input:0 0% 10.5%;--ring:0 0% 62%}html,body{background:hsl(var(--background));color:hsl(var(--foreground));margin:0}</style>
    <meta
      name="description"
      content="KeyzAI adalah teman chat AI gratis. Masuk dengan Google, brainstorm ide, debug kode, menulis lebih cepat, pelajari topik baru, dan riwayat chatmu tersinkron di semua perangkat."
    />
    <meta name="keywords" content="KeyzAI, chat AI, chatbot gratis, asisten AI, koding dengan AI, tanya apa saja ke AI, AI masuk dengan Google" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#14100b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efeeec" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Keyzakyy" />
    <meta name="language" content="Indonesian" />
    <link rel="canonical" href="https://chat.keyzakyy.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KeyzAI" />
    <meta property="og:title" content="KeyzAI" />
    <meta
      property="og:description"
      content="Teman chat AI gratis. Masuk dengan Google, brainstorm ide, tulis kode, belajar lebih cepat, dan riwayat kamu tersinkron di semua perangkat."
    />
    <meta property="og:url" content="https://chat.keyzakyy.com/" />
    <meta property="og:image" content="https://chat.keyzakyy.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KeyzAI" />
    <meta
      name="twitter:description"
      content="Teman chat AI gratis. Masuk dengan Google, brainstorm ide, tulis kode, belajar lebih cepat, dan riwayat kamu tersinkron di semua perangkat."
    />
    <meta name="twitter:image" content="https://chat.keyzakyy.com/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      try {
        if (localStorage.getItem('keyzai-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
