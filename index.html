    <!-- Synchronous dark-theme CSS vars: nilai CSS var (--background dst) tidak
         bisa di-resolve sebelum CSS bundle (async) termuat. Kalau dibiarkan,
         browser pakai default transparent → body putih sesaat sebelum bundle
         masuk, menyebabkan blank flash di mobile.
         Inline style ini dipasang langsung ke <html> supaya nilai var()
         tersedia seketika, tanpa menunggu apa pun. -->
    <style>html{--background:0 0% 4%;--foreground:0 0% 95%;--card:0 0% 6.5%;--card-foreground:0 0% 95%;--popover:0 0% 6.5%;--popover-foreground:0 0% 95%;--primary:0 0% 95%;--primary-foreground:0 0% 8%;--secondary:0 0% 9%;--secondary-foreground:0 0% 95%;--muted:0 0% 9%;--muted-foreground:0 0% 68%;--accent:0 0% 10.5%;--accent-foreground:0 0% 95%;--destructive:40.6 96.1% 40.4%;--destructive-foreground:0 0% 95%;--border:0 0% 10.5%;--input:0 0% 10.5%;--ring:0 0% 62%}html,body{background:hsl(var(--background));color:hsl(var(--foreground));margin:0}</style>
